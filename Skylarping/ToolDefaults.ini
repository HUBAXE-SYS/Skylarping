# Skylarping's defaults for SimpleLLMChat-compatible tools.
#
# Same format as SimpleLLMChat's LLMSettings.ini: one key=value per line, keys are the
# tools' option names (case-insensitive), lines starting with # are comments.
# Order (later wins): the tool's own manifest default, this file, then what you set in
# Tools > AI Services > Tools.
#
# {character_folder} is filled in with the folder of the character using the tool
# (%AppData%\Skylarping\<profile>\Characters\<id>), so data kept there is per character
# and is removed with the character.

# Memory Tools: each character keeps their own memories.
memoriesDirectory={character_folder}\memories
